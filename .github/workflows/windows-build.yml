name: Windows build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test and conditionally build Windows x64
    runs-on: windows-2022
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify release tag version
        run: |
          if ($env:GITHUB_EVENT_NAME -eq "push" -and $env:GITHUB_REF.StartsWith("refs/tags/", [System.StringComparison]::Ordinal)) {
            $version = (Get-Content -LiteralPath package.json -Raw | ConvertFrom-Json).version
            $expectedTag = "v$version"
            if ($env:GITHUB_REF_NAME -cne $expectedTag) {
              throw "Release tag '$env:GITHUB_REF_NAME' does not match package version '$expectedTag'."
            }
          }

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build installer
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
        run: npm run dist

      - name: Self-sign installer with the fixed CI key
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
        env:
          CI_SIGNING_BUNDLE: ${{ secrets.CI_SIGNING_BUNDLE }}
        run: ./.github/scripts/sign-installer.ps1

      - name: Verify build outputs
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
        id: outputs
        run: |
          $version = (Get-Content -LiteralPath package.json -Raw | ConvertFrom-Json).version
          $installer = "WebMapOverlay-$version-Installer.exe"
          foreach ($file in @("dist/$installer", "dist/$installer.blockmap", "dist/latest.yml", "dist/ci-signing.cer", "dist/ci-signature.json")) {
            if (!(Test-Path -LiteralPath $file -PathType Leaf) -or (Get-Item -LiteralPath $file).Length -eq 0) {
              throw "Missing or empty build output: $file"
            }
          }
          "installer=$installer" >> $env:GITHUB_OUTPUT
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Upload build outputs
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: WebMapOverlay-${{ steps.outputs.outputs.version }}-windows-x64-${{ github.run_number }}-${{ github.run_attempt }}
          path: |
            dist/${{ steps.outputs.outputs.installer }}
            dist/${{ steps.outputs.outputs.installer }}.blockmap
            dist/latest.yml
            dist/ci-signing.cer
            dist/ci-signature.json
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
