name: Initialize CI signing key

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: initialize-ci-signing-key
  cancel-in-progress: false

jobs:
  initialize:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-2022
    timeout-minutes: 10
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Create and store the CI identity once
        env:
          GH_TOKEN: ${{ secrets.CI_SIGNING_SETUP_TOKEN }}
        run: ./.github/scripts/initialize-ci-signing.ps1

      - name: Upload public certificate only
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: WebMapOverlay-CI-signing-public-certificate
          path: |
            ci-signing-public/ci-signing.cer
            ci-signing-public/ci-signing-public.json
          if-no-files-found: error
          retention-days: 30
